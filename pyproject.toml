[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Auditable support agent for Twitter customer-support conversations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hiver-agent = "hiver_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
